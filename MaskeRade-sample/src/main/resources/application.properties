# Kranich tour planner - Falkenrath Logistik GmbH (fictional sample for MaskeRade)
spring.application.name=kranich-tourplaner

# MaskeRade case "kebab in texts"
kranich.company.slug=falkenrath-logistik

# MaskeRade case "external contract": property keys set from outside, URL of a real server
falkenrath.api.url=https://api.falkenrath-logistik.de/v1
# MaskeRade case "secret": obviously fake key, reported as secret and replaced by a dummy of the same length
falkenrath.api.key=FLK-LIVE-0000-DUMMY-DO-NOT-USE

# MaskeRade case "JDBC URL / host / IP / mail" (no database driver on the classpath, only for the scanner)
spring.datasource.url=jdbc:postgresql://db.falkenrath.lan:5432/kranich
kranich.build.host=build01.falkenrath.lan
kranich.gateway.ip=10.20.30.40
kranich.notify.mail=j.wessling@falkenrath-logistik.de
